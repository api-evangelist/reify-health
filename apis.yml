name: Reify Health
description: 'Reify Health is a clinical research technology company whose mission is
  to remove clinical trial operations as the bottleneck to delivering new therapies
  to patients. It is the parent organization behind OneStudyTeam, whose StudyTeam platform
  is a cloud-based patient enrollment and recruitment management system connecting research
  sites, sponsors, patients, and vendors on a unified workspace, and Care Access, a
  business unit expanding trial access to underserved communities. StudyTeam is used
  by roughly 70% of the sponsors running the most clinical trials (including Amgen,
  AstraZeneca, and Eli Lilly), across 10,000+ research sites in 100+ countries. Reify
  Health is backed by Altimeter Capital, Battery Ventures, ICONIQ Capital, and Sierra
  Ventures. No public developer API, developer portal, or API specification was found
  during enrichment; this profile captures company identity, links, and domain-security
  posture.'
